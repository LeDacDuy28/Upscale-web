services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: webapp/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_QUEUE: "true"
      STORAGE_DIR: /data/storage
      MODELS_DIR: /workspace/research/models
    volumes:
      - upscale_storage:/data/storage
      - ./research/models:/workspace/research/models:ro
    depends_on:
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: webapp/backend/Dockerfile
    restart: unless-stopped
    command: ["rq", "worker", "upscale", "--url", "redis://redis:6379/0"]
    env_file:
      - .env.example
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      MODELS_DIR: /workspace/research/models
    volumes:
      - upscale_storage:/data/storage
      - ./research/models:/workspace/research/models:ro
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: webapp/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  upscale_storage:
